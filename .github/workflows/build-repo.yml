name: Build and Publish XBPS Repository

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Give the Action permission to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
      volumes:
        - /dev:/dev

    steps:
      - name: Prepare container
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y sudo bash grep curl git openssl xz wget
          useradd -G xbuilder -M builder

      - name: Checkout custom packages
        uses: actions/checkout@v4
        with:
          path: "scientios-repo"

      - name: Checkout installer
        uses: actions/checkout@v4
        with:
          repository: ScientiOS/installer
          path: "installer"
          token: ${{ secrets.PAT_TOKEN }}

      - name: Clone void-packages
        run: |
          git clone --depth 1 https://github.com/void-linux/void-packages.git void-packages
          chown -R builder:builder void-packages

      - name: Bootstrap xbps-src
        run: |
          cd void-packages
          echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
          echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf
          sudo -Eu builder ./xbps-src binary-bootstrap

      - name: Inject custom packages
        run: |
          cp -r scientios-repo/srcpkgs/* void-packages/srcpkgs/
          if [ -d "scientios-repo/common" ]; then
            cp -r scientios-repo/common/* void-packages/common/
          fi
          # Inject installer source directly into the srcpkgs tree
          # so it is accessible inside the xbps-src chroot
          cp -r installer void-packages/srcpkgs/scientios-install/installer-src

      - name: Fetch existing repository
        run: |
          mkdir -p void-packages/hostdir/binpkgs/nonfree
          
          # Iterate over packages and directly fetch the built .xbps files and their sigs
          for pkg in scientios-repo/srcpkgs/*/; do
            pkgname=$(basename "$pkg")
            template_ver=$(grep -E "^version=" "$pkg/template" | cut -d= -f2 | tr -d '"'\''')
            template_rev=$(grep -E "^revision=" "$pkg/template" | cut -d= -f2 | tr -d '"'\''')
            target_pkgver="${pkgname}-${template_ver}_${template_rev}"
            
            # Check if package is nonfree
            repo_path=""
            if grep -q 'repository="nonfree"' "$pkg/template" || grep -q "repository='nonfree'" "$pkg/template"; then
              repo_path="nonfree/"
            fi
            
            echo "Attempting to fetch ${repo_path}${target_pkgver}.x86_64.xbps..."
            wget -q -P void-packages/hostdir/binpkgs/${repo_path} https://scientios.github.io/packages/${repo_path}${target_pkgver}.x86_64.xbps || true
            wget -q -P void-packages/hostdir/binpkgs/${repo_path} https://scientios.github.io/packages/${repo_path}${target_pkgver}.x86_64.xbps.sig || true
          done

      - name: Build custom packages
        run: |
          cd void-packages
          for pkg in ../scientios-repo/srcpkgs/*/; do
            pkgname=$(basename "$pkg")
            
            template_ver=$(grep -E "^version=" "$pkg/template" | cut -d= -f2 | tr -d '"'\''')
            template_rev=$(grep -E "^revision=" "$pkg/template" | cut -d= -f2 | tr -d '"'\''')
            target_pkgver="${pkgname}-${template_ver}_${template_rev}"
            
            repo_path=""
            if grep -q 'repository="nonfree"' "$pkg/template" || grep -q "repository='nonfree'" "$pkg/template"; then
              repo_path="nonfree/"
            fi
            
            echo "Checking $target_pkgver..."
            
            if [ -f "hostdir/binpkgs/${repo_path}${target_pkgver}.x86_64.xbps" ]; then
              echo "$target_pkgver is already built. Skipping."
            else
              echo "Building $target_pkgver..."
              sudo -Eu builder ./xbps-src -A x86_64 pkg "$pkgname"
            fi
          done

      - name: Setup Private Key
        run: |
          echo "${{ secrets.XBPS_PRIVATE_KEY }}" > privkey.pem
          chmod 600 privkey.pem

      - name: Sign packages and generate index
        run: |
          REPO_DIR="void-packages/hostdir/binpkgs"
          # Sign all built .xbps files recursively
          find $REPO_DIR -name "*.xbps" -exec xbps-rindex --sign-pkg --privkey privkey.pem {} +
          
          # Sign the repository metadata for the main repo and any sub-repos (like nonfree)
          for dir in $(find $REPO_DIR -type d); do
            # Only generate index if there are .xbps files in this specific directory
            if ls $dir/*.xbps 1> /dev/null 2>&1; then
              # Re-index all packages to ensure the x86_64-repodata file exists
              xbps-rindex -a $dir/*.xbps
              # Sign the newly generated index
              xbps-rindex --sign --signedby "ScientiOS" --privkey privkey.pem $dir
            fi
          done
          
          # Clean up the key
          rm -f privkey.pem

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "void-packages/hostdir/binpkgs"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5